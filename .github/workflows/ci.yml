name: Pull request gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site:
    name: Node, content, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and property tests
        run: npm test
      - name: Astro type checks
        run: npm run check
      - name: Content validation
        run: npm run validate
      - name: Production build
        run: npm run build

  scraper:
    name: Python scraper tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scraper/requirements.lock
      - name: Install scraper dependencies
        run: python -m pip install --require-hashes -r scraper/requirements.lock
      - name: Run scraper tests
        run: python -m pytest scraper/tests

  supply-chain:
    name: Dependency and provenance review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce automated verified-content provenance
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          EXPECTED_REFRESH_BOT: ${{ vars.CONTENT_REFRESH_APP_BOT_LOGIN }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attestation=$(python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          base = f"origin/{os.environ['BASE_REF']}"
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True,
          ).splitlines())

          # Bootstrap is allowed only while these files do not exist in base.
          # Once merged, neither the manifest nor its policy hash can be rebased.
          for immutable in ('src/lib/trust-policy.ts', 'src/data/legacy-lkg.json'):
              exists_in_base = subprocess.run(
                  ['git', 'cat-file', '-e', f'{base}:{immutable}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if exists_in_base and immutable in changed:
                  raise SystemExit(f'immutable legacy trust baseline changed: {immutable}')

          protected = {
              path for path in changed
              if (path.startswith('src/content/facts/fact-') and path.endswith('.json'))
              or path in {
                  'src/data/verified-import-report.json',
                  'src/data/verified-provenance.json',
              }
          }
          if not protected:
              print('SKIP')
              raise SystemExit(0)

          expected_bot = os.environ.get('EXPECTED_REFRESH_BOT', '').strip()
          if not expected_bot:
              raise SystemExit('CONTENT_REFRESH_APP_BOT_LOGIN repository variable is not configured')
          if not (
              os.environ['PR_HEAD_REF'] == 'automation/scraper-refresh'
              and os.environ['PR_HEAD_REPOSITORY'] == os.environ['REPOSITORY']
              and os.environ['PR_AUTHOR_TYPE'] == 'Bot'
              and os.environ['PR_AUTHOR_LOGIN'] == expected_bot
          ):
              raise SystemExit('verified content may only change through the configured refresh App')

          path = Path('src/data/verified-provenance.json')
          if not path.is_file() or path.is_symlink():
              raise SystemExit('automation refresh lacks a regular verified provenance file')
          provenance = json.loads(path.read_text(encoding='utf-8'))
          files = provenance.get('files')
          run_id = str(provenance.get('workflowRunId', ''))
          source_commit = str(provenance.get('sourceCommit', ''))
          if (provenance.get('schemaVersion') != 1 or not isinstance(files, dict)):
              raise SystemExit('automation provenance schema is invalid')
          if not run_id.isdigit() or not re.fullmatch(r'[0-9a-f]{40}', source_commit):
              raise SystemExit('automation provenance run/commit identity is invalid')

          expected_files = {
              'scraper/source-plan.json',
              'src/data/verified-import-report.json',
              *(
                  candidate.as_posix()
                  for candidate in sorted(Path('src/content/facts').glob('fact-*.json'))
              ),
          }
          if set(files) != expected_files:
              raise SystemExit('automation provenance does not exactly cover the publishable file set')
          for relative, expected in files.items():
              candidate = Path(relative)
              if not candidate.is_file() or candidate.is_symlink():
                  raise SystemExit(f'provenance file is missing or unsafe: {relative}')
              actual = f"sha256:{hashlib.sha256(candidate.read_bytes()).hexdigest()}"
              if actual != expected:
                  raise SystemExit(f'provenance digest mismatch: {relative}')
          print(f'{run_id}|{source_commit}')
          PY
          )
          if [[ "$attestation" == "SKIP" ]]; then
            exit 0
          fi
          IFS='|' read -r run_id source_commit <<< "$attestation"
          IFS=$'\t' read -r run_status run_conclusion run_event run_branch run_sha run_path run_repository < <(
            gh api "repos/$REPOSITORY/actions/runs/$run_id" \
              --jq '[.status,.conclusion,.event,.head_branch,.head_sha,.path,.repository.full_name] | @tsv'
          )
          if [[ "$run_status" != "completed" || "$run_conclusion" != "success" ||
                "$run_branch" != "main" || "$run_sha" != "$source_commit" ||
                "$run_path" != ".github/workflows/refresh-content.yml" ||
                "$run_repository" != "$REPOSITORY" ||
                ( "$run_event" != "schedule" && "$run_event" != "workflow_dispatch" ) ]]; then
            echo "Provenance does not identify a successful trusted refresh run" >&2
            exit 1
          fi
          artifact_dir=$(mktemp -d)
          trap 'rm -rf "$artifact_dir"' EXIT
          gh run download "$run_id" --repo "$REPOSITORY" \
            --name "verified-content-$run_id" --dir "$artifact_dir"
          (cd "$artifact_dir" && sha256sum -c artifact.sha256)
          python - "$artifact_dir" <<'PY'
          import json, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          local_provenance = Path('src/data/verified-provenance.json')
          artifact_provenance = root / 'src/data/verified-provenance.json'
          if artifact_provenance.read_bytes() != local_provenance.read_bytes():
              raise SystemExit('PR provenance differs from the trusted run artifact')
          provenance = json.loads(artifact_provenance.read_text(encoding='utf-8'))
          expected = set(provenance['files']) | {
              'artifact.sha256', 'src/data/verified-provenance.json',
          }
          actual = {
              item.relative_to(root).as_posix()
              for item in root.rglob('*') if item.is_file()
          }
          if actual != expected or any(item.is_symlink() for item in root.rglob('*')):
              raise SystemExit('trusted run artifact file set is unexpected')
          for relative in provenance['files']:
              if (root / relative).read_bytes() != Path(relative).read_bytes():
                  raise SystemExit(f'PR file differs from trusted run artifact: {relative}')
          PY
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          config-file: ./.github/dependency-review-config.yml
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Audit Node lockfile
        run: npm audit --audit-level=high
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scraper/requirements.lock
      - name: Audit Python requirements
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r scraper/requirements.lock
