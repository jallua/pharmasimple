name: Gate and deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  gate-and-build:
    if: github.ref == 'refs/heads/main'
    name: Re-run gates and build immutable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test, type-check, validate content, and build
        run: |
          npm test
          npm run check
          npm run validate
          npm run build
      - name: Audit Node lockfile
        run: npm audit --audit-level=high
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scraper/requirements.lock
      - name: Test scraper with hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r scraper/requirements.lock
          python -m pytest scraper/tests
      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.sha }}
          path: ./dist
          retention-days: 30

  python-audit:
    if: github.ref == 'refs/heads/main'
    name: Audit Python dependencies without artifact access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout lockfile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scraper/requirements.lock
      - name: Audit locked scraper requirements
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r scraper/requirements.lock

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy exact build artifact
    needs: [gate-and-build, python-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.sha }}
